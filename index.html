<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AP1 交互式2D分形 Sierpinski</title>
    <style>
        canvas {
            background: black;
            border: 1px solid #666;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <canvas width="800" height="800" id="canvas"></canvas>
    <div id="ui">
        <div>渲染模式：</div>
        <button onclick="setRenderMode(0)">0‑混沌游戏 POINTS</button><br>
        <button onclick="setRenderMode(1)">1‑递归 LINES线框</button><br>
        <button onclick="setRenderMode(2)">2‑递归 TRIANGLES实体</button>
        <hr>
        <div>递归深度:<span id="depthVal">5</span></div>
        <input type="range" min="0" max="6" value="5" id="depthSlider"><br>
        <div>点大小:<span id="pointSizeVal">2.0</span></div>
        <input type="range" min="1" max="8" step="0.5" value="2" id="pointSizeSlider"><br>
        <hr>
        <div>配色方案</div>
        <button onclick="setColorScheme(0)">方案1(白)</button>
        <button onclick="setColorScheme(1)">方案2(青)</button>
        <button onclick="setColorScheme(2)">方案3(橙)</button>
        <hr>
        <div>快捷键：1/2/3切换模式｜空格：暂停/播放生长动画</div>
        <div>鼠标：左键拖拽平移｜滚轮缩放</div>
    </div>

    <script src="./Common/webgl-utils.js"></script>
    <script src="./Common/initShaders.js"></script>
    <script type="module">
        import { initWebGL, setRenderMode, setDepth, setPointSize, setColorScheme } from "./sierpinski.js";
        const canvas = document.getElementById("canvas");
        initWebGL(canvas);
        window.setRenderMode = setRenderMode;
        window.setColorScheme = setColorScheme;

        //深度滑块
        const depthSlider = document.getElementById("depthSlider");
        const depthVal = document.getElementById("depthVal");
        depthSlider.oninput = () => {
            const v = Number(depthSlider.value);
            depthVal.textContent = v;
            setDepth(v);
        };
        //点大小滑块
        const pointSizeSlider = document.getElementById("pointSizeSlider");
        const pointSizeVal = document.getElementById("pointSizeVal");
        pointSizeSlider.oninput = () => {
            const v = Number(pointSizeSlider.value);
            pointSizeVal.textContent = v;
            setPointSize(v);
        };

        //键盘监听
        document.addEventListener("keydown", (e) => {
            if (e.key === "1") setRenderMode(0);
            if (e.key === "2") setRenderMode(1);
            if (e.key === "3") setRenderMode(2);
            if (e.key === " ") {
                e.preventDefault();
                import("./sierpinski.js").then(m => m.toggleAnimate());
            }
        });
    </script>
</body>
</html>
